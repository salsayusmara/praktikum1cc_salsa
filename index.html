<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Practice - Salsa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .badge {
            background: #38bdf8;
            color: #0f172a;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status-box {
            background: #090d16;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #38bdf8;
            text-align: left;
        }
        .status-box p {
            margin: 0;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.8;
        }
        .btn {
            background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Praktikum Cloud Computing</span>
        <h1>Web Server Deployment</h1>
        <p>Website ini berhasil di-deploy menggunakan platform Vercel untuk memenuhi tugas Modul 01.</p>
        
        <div class="status-box">
            <p>🌐 <strong>Status Host:</strong> Active / Online</p>
            <p>🕒 <strong>Waktu Server:</strong> <span id="time">-</span></p>
        </div>

        <button class="btn" onclick="cekStatus()">Cek Koneksi Server</button>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText = now.toLocaleString('id-ID');
        }

        function cekStatus() {
            alert("Koneksi berhasil! Website berjalan dengan lancar.");
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
