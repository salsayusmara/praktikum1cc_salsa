<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Practice - Pink Cat Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #ffb6c1;
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.2);
        }
        .cat-avatar {
            font-size: 64px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .badge {
            background: #ff69b4;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #d63384;
        }
        p {
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status-box {
            background: #fff0f5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #ff69b4;
            text-align: left;
        }
        .status-box p {
            margin: 0;
            font-size: 13px;
            color: #495057;
            line-height: 1.8;
        }
        .btn {
            background: linear-gradient(90deg, #ff69b4 0%, #ff8da1 100%);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(255, 105, 180, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cat-avatar">🐱✨</div>
        <span class="badge">Pink Cloud Server</span>
        <h1>Web Server Deployment</h1>
        <p>Website ini berhasil di-deploy menggunakan platform Vercel dengan tema serba pink dan kucing imut! 🐾</p>
        
        <div class="status-box">
            <p>🐾 <strong>Status Host:</strong> Active & Meow-velous!</p>
            <p>🕒 <strong>Waktu Server:</strong> <span id="time">-</span></p>
        </div>

        <button class="btn" onclick="cekStatus()">Sapa Kucing Server 🐾</button>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText = now.toLocaleString('id-ID');
        }

        function cekStatus() {
            alert("Meow! 🐱 Website kamu sudah aktif dan berjalan lancar di Vercel!");
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
